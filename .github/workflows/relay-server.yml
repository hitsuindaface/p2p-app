name: relay-server image

on:
  push:
    branches: [main]
    paths:
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/hitsuindaface/p2p-relay-server:latest
            ghcr.io/hitsuindaface/p2p-relay-server:${{ github.sha }}
