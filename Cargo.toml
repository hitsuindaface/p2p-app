[package]
name = "p2p-app"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
hyper = { version = "1.12.0", features = ["full"] }
socket2 = { version = "0.6.5", features = ["all"] }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = "2.12.5"
tokio = { version = "1.54.1", features = ["full"] }
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "dns", "noise", "yamux", "mdns", "kad", "relay", "dcutr", "request-response", "cbor", "identify", "ping", "macros", "ed25519", "rsa"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
rand = "0.10.4"
ciborium = "0.2.2"
futures = "0.3.34"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.154"
zeroize = { version = "1.9.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace]
members = [".", "xtask", "relay-server"]
